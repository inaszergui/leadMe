<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadMe | قيادتك الذاتية من عمق أهدافك لعلو السحاب</title>
    <!-- Google Fonts: Tajawal & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Tajawal', 'Cairo', 'sans-serif'],
                    },
                    colors: {
                        sky: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    boxShadow: {
                        'cloud': '0 10px 30px -5px rgba(14, 165, 233, 0.1), 0 4px 12px -5px rgba(14, 165, 233, 0.05)',
                        'cloud-lg': '0 20px 40px -15px rgba(14, 165, 233, 0.15), 0 10px 20px -10px rgba(14, 165, 233, 0.1)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #bae6fd 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient animated clouds in the background */
        .ambient-cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 9999px;
            pointer-events: none;
            z-index: 0;
            filter: blur(4px);
            animation: floatCloud 25s infinite linear;
        }

        @keyframes floatCloud {
            0% { transform: translateX(120vw) translateY(0); }
            100% { transform: translateX(-50vw) translateY(-50px); }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 99px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(14, 165, 233, 0.3);
            border-radius: 99px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(14, 165, 233, 0.5);
        }

        /* Smooth tab transition */
        .tab-content {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="text-sky-900 pb-12 antialiased">

    <div class="ambient-cloud w-64 h-24 top-10 left-10" style="animation-duration: 40s; opacity: 0.6;"></div>
    <div class="ambient-cloud w-96 h-32 top-1/3 right-10" style="animation-duration: 55s; opacity: 0.5; animation-delay: -10s;"></div>
    <div class="ambient-cloud w-80 h-28 bottom-20 left-1/4" style="animation-duration: 45s; opacity: 0.4; animation-delay: -20s;"></div>

    <div id="root" class="relative z-10"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseImports = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, getDoc, setDoc, onSnapshot
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Constants fallback for Canvas Environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'leadme-platform-sky';
        const defaultFirebaseConfig = {
            apiKey: "",
            authDomain: "leadme-mock.firebaseapp.com",
            projectId: "leadme-mock",
            storageBucket: "leadme-mock.appspot.com",
            messagingSenderId: "123456",
            appId: "1:123456:web:123"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : defaultFirebaseConfig;
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // Core App Component
        function App() {
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [syncing, setSyncing] = useState(false);
            const [toast, setToast] = useState(null);

            // Cloud Data state (Vision, values, goals)
            const [vision, setVision] = useState('');
            const [values, setValues] = useState([]);
            const [newValue, setNewValue] = useState('');
            const [strategicGoal, setStrategicGoal] = useState('');
            const [subGoals, setSubGoals] = useState([]);
            const [newSubGoal, setNewSubGoal] = useState('');

            // Tasks and Routine state
            const [tasks, setTasks] = useState([]);
            const [newTaskText, setNewTaskText] = useState('');
            const [newTaskCategory, setNewTaskCategory] = useState('daily'); // daily or routine

            // Notes state
            const [noteText, setNoteText] = useState('');

            // AI (Gemini) motivation state
            const [aiMessage, setAiMessage] = useState('');
            const [generatingAi, setGeneratingAi] = useState(false);

            // Quick stats for dashboard
            const [quotes] = useState([
                { text: "ارتفع فوق السحاب، ودع أهدافك تكون بوصلتك الفريدة.", author: "LeadMe Compass" },
                { text: "البدايات المشتعلة بالرؤية تنتهي بالنهايات المشرقة بالإنجاز.", author: "حكمة السحاب" },
                { text: "خطوة واحدة صغيرة كل يوم ترسم لوحة نجاحك العظيمة.", author: "دليل القيادة" }
            ]);
            const [activeQuote, setActiveQuote] = useState(0);

            // Ref to prevent loop saves
            const dbRef = useRef(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            useEffect(() => {
                // Rotate quotes
                const interval = setInterval(() => {
                    setActiveQuote((prev) => (prev + 1) % quotes.length);
                }, 8000);
                return () => clearInterval(interval);
            }, [quotes.length]);

            useEffect(() => {
                const initializeFirebase = async () => {
                    try {
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseImports;
                        const app = initializeApp(firebaseConfig);
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        dbRef.current = db;

                        let loggedUser = null;
                        if (initialAuthToken) {
                            try {
                                const cred = await signInWithCustomToken(auth, initialAuthToken);
                                loggedUser = cred.user;
                            } catch (err) {
                                console.warn("Failed custom token auth, trying anonymous fallback.", err);
                                const cred = await signInAnonymously(auth);
                                loggedUser = cred.user;
                            }
                        } else {
                            const cred = await signInAnonymously(auth);
                            loggedUser = cred.user;
                        }

                        setUser(loggedUser);
                        
                        // Set up real-time sync with Rule 1 Compliant Path
                        if (loggedUser) {
                            setupRealtimeData(db, loggedUser.uid);
                        } else {
                            setLoading(false);
                        }
                    } catch (error) {
                        console.error("Firebase init/auth error: ", error);
                        showToast("خطأ في الاتصال بالسحاب. تأكد من إعدادات الشبكة.", "error");
                        setLoading(false);
                    }
                };

                if (window.firebaseImports) {
                    initializeFirebase();
                } else {
                    // Try loaded check delay
                    const checkInterval = setInterval(() => {
                        if (window.firebaseImports) {
                            initializeFirebase();
                            clearInterval(checkInterval);
                        }
                    }, 500);
                    return () => clearInterval(checkInterval);
                }
            }, []);

            const setupRealtimeData = (db, uid) => {
                const { doc, onSnapshot } = window.firebaseImports;
                
                // Rule 1: /artifacts/{appId}/users/{userId}/{collectionName}
                // We'll store everything in a single comprehensive profile doc to reduce complexity and avoid compound query bugs
                const profileDocRef = doc(db, 'artifacts', appId, 'users', uid, 'profile', 'data');

                const unsubscribe = onSnapshot(profileDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setVision(data.vision || '');
                        setValues(data.values || []);
                        setStrategicGoal(data.strategicGoal || '');
                        setSubGoals(data.subGoals || []);
                        setTasks(data.tasks || []);
                        setNoteText(data.noteText || '');
                        if (data.aiMessage) setAiMessage(data.aiMessage);
                    } else {
                        // Document doesn't exist yet, write standard welcome info
                        saveToCloud({
                            vision: 'أن أكون ملهماً وقائداً لذاتي نحو معالي الإنجاز وبناء أثر حقيقي.',
                            values: ['الشغف', 'النمو المستمر', 'التأثير الإيجابي'],
                            strategicGoal: 'تأسيس مشروع قيادي شخصي يعزز توازني النفسي والمهني.',
                            subGoals: [
                                { id: 1, text: 'قراءة كتاب واحد شهرياً في القيادة وتطوير الذات', completed: false },
                                { id: 2, text: 'تخصيص نصف ساعة يومياً للتأمل وتدبر الرؤية', completed: false }
                            ],
                            tasks: [
                                { id: 101, text: 'التأمل الصباحي وكتابة نية اليوم', completed: false, category: 'routine' },
                                { id: 102, text: 'مراجعة أهدافي الأسبوعية والتأكد من توافقها', completed: false, category: 'daily' }
                            ],
                            noteText: 'مساحة السحاب الخاصة بك.. دوّن هنا أهم الأفكار الطارئة والخواطر الملهمة التي تعبر فكرك كالغيمة.'
                        }, uid);
                    }
                    setLoading(false);
                }, (error) => {
                    console.error("Error listening to profile updates:", error);
                    setLoading(false);
                });

                return unsubscribe;
            };

            const saveToCloud = async (customData = null, uid = null) => {
                const activeUid = uid || (user ? user.uid : null);
                const db = dbRef.current;
                if (!activeUid || !db) return;

                setSyncing(true);
                try {
                    const { doc, setDoc } = window.firebaseImports;
                    const profileDocRef = doc(db, 'artifacts', appId, 'users', activeUid, 'profile', 'data');
                    
                    const dataPayload = customData || {
                        vision,
                        values,
                        strategicGoal,
                        subGoals,
                        tasks,
                        noteText,
                        aiMessage
                    };

                    await setDoc(profileDocRef, dataPayload, { merge: true });
                } catch (error) {
                    console.error("Error saving data to cloud:", error);
                    showToast("حدث خطأ أثناء المزامنة السحابية", "error");
                } finally {
                    setSyncing(false);
                }
            };

            // Trigger manual cloud save helper
            const triggerCloudSave = () => {
                saveToCloud();
                showToast("تم الحفاظ على رؤيتك وأهدافك في فضاء السحاب بنجاح!");
            };

            const handleAddValue = (e) => {
                e.preventDefault();
                if (!newValue.trim()) return;
                if (values.includes(newValue.trim())) {
                    showToast("هذه القيمة مضافة بالفعل", "warning");
                    return;
                }
                const updated = [...values, newValue.trim()];
                setValues(updated);
                setNewValue('');
                saveToCloud({ ...getLatestState(), values: updated });
            };

            const handleRemoveValue = (index) => {
                const updated = values.filter((_, i) => i !== index);
                setValues(updated);
                saveToCloud({ ...getLatestState(), values: updated });
            };

            const handleAddSubGoal = (e) => {
                e.preventDefault();
                if (!newSubGoal.trim()) return;
                const updated = [
                    ...subGoals,
                    { id: Date.now(), text: newSubGoal.trim(), completed: false }
                ];
                setSubGoals(updated);
                setNewSubGoal('');
                saveToCloud({ ...getLatestState(), subGoals: updated });
            };

            const handleToggleSubGoal = (id) => {
                const updated = subGoals.map(sg => sg.id === id ? { ...sg, completed: !sg.completed } : sg);
                setSubGoals(updated);
                saveToCloud({ ...getLatestState(), subGoals: updated });
            };

            const handleRemoveSubGoal = (id) => {
                const updated = subGoals.filter(sg => sg.id !== id);
                setSubGoals(updated);
                saveToCloud({ ...getLatestState(), subGoals: updated });
            };

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTaskText.trim()) return;
                const updated = [
                    ...tasks,
                    { id: Date.now(), text: newTaskText.trim(), completed: false, category: newTaskCategory }
                ];
                setTasks(updated);
                setNewTaskText('');
                saveToCloud({ ...getLatestState(), tasks: updated });
            };

            const handleToggleTask = (id) => {
                const updated = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
                setTasks(updated);
                saveToCloud({ ...getLatestState(), tasks: updated });
            };

            const handleRemoveTask = (id) => {
                const updated = tasks.filter(t => t.id !== id);
                setTasks(updated);
                saveToCloud({ ...getLatestState(), tasks: updated });
            };

            const handleClearCompletedTasks = () => {
                const updated = tasks.filter(t => !t.completed);
                setTasks(updated);
                saveToCloud({ ...getLatestState(), tasks: updated });
                showToast("تم تنظيف المهام المنجزة بنجاح.");
            };

            // Get state safely for inline updates
            const getLatestState = () => {
                return { vision, values, strategicGoal, subGoals, tasks, noteText, aiMessage };
            };

            const generateMotivationFromAI = async () => {
                setGeneratingAi(true);
                try {
                    const systemPrompt = "أنت موجه ومرشد شخصي ملهم ومحفز اسمه 'LeadMe Compass'. مهمتك هي إلهام المستخدم وبث طاقة إيجابية قوية بناءً على رؤيته وقيمه وأهدافه. اكتب له رسالة تحفيزية شخصية عميقة وموجهة باللغة العربية الفصحى الأنيقة والجذابة. لا تتجاوز 4 أسطر قصيرة ومحفزة تلمس القلب وتدفع للإنجاز مع دعابة خفيفة تناسب روح السحاب والارتقاء والريادة الذاتية.";
                    
                    const userQuery = `الرؤية الشخصية: ${vision || 'بناء مسار متميز والارتقاء بالذات'}
القيم المحركة: ${values.join('، ') || 'النمو والتأثير والصدق'}
الهدف الاستراتيجي الأكبر: ${strategicGoal || 'تحقيق التوازن وبناء المعرفة'}
الأهداف الفرعية الحالية: ${subGoals.map(s => s.text + (s.completed ? ' (مكتمل)' : ' (قيد العمل)')).join('، ') || 'المثابرة اليومية'}
المهام المتبقية اليوم: ${tasks.filter(t => !t.completed).map(t => t.text).join('، ') || 'أفعال القيادة البسيطة'}

الرجاء إنتاج جرعة ملهمة فورية تأخذ بيدي لعلو السحاب اليوم وتوقظ شغفي من جديد!`;

                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;

                    const payload = {
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    const candidateText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (candidateText) {
                        setAiMessage(candidateText);
                        saveToCloud({ ...getLatestState(), aiMessage: candidateText });
                        showToast("تلقيت رسالة إلهام سحابية جديدة!", "success");
                    } else {
                        showToast("تعذر استخلاص الرسالة السحابية من المرشد الذكي.", "warning");
                    }
                } catch (error) {
                    console.error("AI Generation Error:", error);
                    showToast("لم تنجح سحابة الذكاء الاصطناعي في الاستجابة حالياً، حاول مجدداً.", "error");
                } finally {
                    setGeneratingAi(false);
                }
            };

            if (loading) {
                return (
                    <div class="min-height-screen flex flex-col justify-center items-center h-screen space-y-4">
                        <div class="relative w-20 h-20 animate-bounce">
                            {}
                            <svg class="text-sky-500 w-20 h-20" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z"/>
                            </svg>
                        </div>
                        <p class="text-sky-800 text-lg font-semibold animate-pulse">نرسو ببياناتك على سحابة آمنة...</p>
                    </div>
                );
            }

            // Calculation values for percentages
            const completedSubGoalsCount = subGoals.filter(s => s.completed).length;
            const subGoalsPercent = subGoals.length > 0 ? Math.round((completedSubGoalsCount / subGoals.length) * 100) : 0;

            const completedTasksCount = tasks.filter(t => t.completed).length;
            const tasksPercent = tasks.length > 0 ? Math.round((completedTasksCount / tasks.length) * 100) : 0;

            return (
                <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                    {/* Toast Notification */}
                    {toast && (
                        <div class={`fixed bottom-5 left-5 z-50 flex items-center p-4 rounded-xl shadow-lg border text-sm transition-all transform scale-100 ${
                            toast.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' :
                            toast.type === 'warning' ? 'bg-amber-50 text-amber-800 border-amber-200' :
                            'bg-sky-50 text-sky-900 border-sky-200'
                        }`}>
                            <i data-lucide="info" class="w-5 h-5 ml-2"></i>
                            <span class="font-medium">{toast.message}</span>
                        </div>
                    )}

                    {}
                    <header class="bg-white/70 backdrop-blur-md rounded-2xl p-6 mb-8 border border-white/60 shadow-cloud flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="bg-sky-500 p-3 rounded-2xl text-white shadow-lg shadow-sky-500/30">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
                                </svg>
                            </div>
                            <div>
                                <h1 class="text-3xl font-extrabold tracking-tight text-sky-950 flex items-center gap-2">
                                    LeadMe <span class="text-xs px-2 py-0.5 bg-sky-100 text-sky-700 rounded-full font-bold">بوصلة السماء</span>
                                </h1>
                                <p class="text-sky-600 text-sm">حلّق بأهدافك الشخصية وخططك الاستراتيجية لعلو السحاب</p>
                            </div>
                        </div>

                        {/* Top controls and sync state */}
                        <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                            <div class="text-xs bg-sky-50 border border-sky-100 px-3 py-1.5 rounded-xl flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span class="text-sky-800 font-medium">سحابي آمن</span>
                                <span class="text-sky-400">|</span>
                                <span class="text-sky-600 font-mono select-all" title="معرف المستخدم الخاص بك">ID: {user?.uid.substring(0, 8)}...</span>
                            </div>

                            <button 
                                onClick={triggerCloudSave}
                                disabled={syncing}
                                class="bg-gradient-to-r from-sky-500 to-sky-600 hover:from-sky-600 hover:to-sky-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-md hover:shadow-lg transition-all"
                            >
                                {syncing ? (
                                    <span class="animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
                                ) : (
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                                    </svg>
                                )}
                                حفظ فوري للسحاب
                            </button>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav class="flex overflow-x-auto gap-2 mb-8 bg-sky-200/40 p-1.5 rounded-2xl border border-white/50 backdrop-blur-sm">
                        <button 
                            onClick={() => setActiveTab('dashboard')}
                            class={`flex-1 py-3 px-4 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2 whitespace-nowrap ${
                                activeTab === 'dashboard' 
                                ? 'bg-white text-sky-700 shadow-sm' 
                                : 'text-sky-800 hover:bg-white/40'
                            }`}
                        >
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                            </svg>
                            لوحة البوصلة العامة
                        </button>

                                                    </svg>

                                            {aiMessage && (

                                            <span class="absolute text-2xl font-black">{subGoalsPercent}%</span>
                                        </div>
                                        <p class="text-xs text-sky-100 font-bold mt-3">إنجاز الأهداف الاستراتيجية</p>

                                </div>
                            </div>

                            {/* Dashboard Cards Grid */}

                                        <div class="flex items-center justify-between">
                                            <span class="text-xs font-bold text-sky-600 bg-sky-100 px-3 py-1 rounded-full">الهدف الاستراتيجي الكبير</span>

                                        </div>
                                        <h3 class="text-xl font-bold text-sky-950">
                                            {strategicGoal || "لم تحدد هدفك الاستراتيجي الأساسي بعد. اذهب لقسم الرؤية والبوصلة لرسمه."}

                                        <p class="text-sky-600 text-sm leading-relaxed">

                                    </div>

                                    <div class="mt-6 pt-4 border-t border-sky-100/50 flex justify-between items-center">
                                        <span class="text-xs text-sky-500">تم إكمال {completedSubGoalsCount} من {subGoals.length} أهداف فرعية</span>
                                        <button 
                                            onClick={() => setActiveTab('strategy')} 
                                            class="text-xs font-bold text-sky-600 hover:text-sky-800 flex items-center gap-1"

                                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                {/* Quotes widget */}
                                <div class="bg-gradient-to-br from-blue-900 to-sky-950 text-white p-6 rounded-3xl shadow-cloud-lg flex flex-col justify-between relative overflow-hidden">

                                        <svg class="w-8 h-8 text-sky-400 opacity-60" fill="currentColor" viewBox="0 0 24 24">

                                        </svg>
                                        <span class="text-xs text-sky-300 font-semibold">تأملات علوية</span>
                                    </div>

                                    <div class="space-y-2 py-4">
                                        <p class="text-base font-medium leading-relaxed italic transition-all duration-500">
                                            "{quotes[activeQuote].text}"

                                    </div>

                                    <div class="flex gap-1.5 justify-center">
                                        {quotes.map((_, i) => (
                                            <span 
                                                key={i} 
                                                class={`h-1.5 rounded-full transition-all duration-300 ${i === activeQuote ? 'w-5 bg-sky-400' : 'w-1.5 bg-white/20'}`}
                                            ></span>
                                        ))}
                                    </div>
                                </div>
                            </div>

                            {/* Overview Split Section */}
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                            <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>
                                            مهام اليوم العاجلة

                                        <span class="text-xs bg-sky-100 text-sky-800 px-2 py-1 rounded-md font-bold">{tasksPercent}% مكتمل</span>

                                    <div class="space-y-3 max-h-[250px] overflow-y-auto pr-1 custom-scrollbar">
                                        {tasks.length === 0 ? (
                                            <div class="text-center py-8 text-sky-500">

                                                        task.completed 
                                                        ? 'bg-sky-50/50 border-sky-100 line-through text-sky-400'

                                                    </span>
                                                </div>
                                            ))

                                    </div>
                                </div>

                                {/* Values Compass */}
                                <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud flex flex-col justify-between">
                                    <div>
                                        <h3 class="font-extrabold text-sky-950 text-lg flex items-center gap-2 mb-4">
                                            <span class="w-2.5 h-2.5 rounded-full bg-sky-500"></span>
                                            منظومة قيمي المحركة
                                        </h3>
                                        
                                        <div class="flex flex-wrap gap-2.5">
                                            {values.length === 0 ? (
                                                <p class="text-sky-500 text-sm italic py-4">لم تقم بتسجيل قيمك المحركة بعد.</p>
                                            ) : (
                                                values.map((val, index) => (
                                                    <span 
                                                        key={index} 
                                                        class="bg-gradient-to-r from-sky-50 to-sky-100 text-sky-800 border border-sky-200/50 px-3.5 py-1.5 rounded-2xl text-xs font-bold flex items-center shadow-sm"
                                                    >
                                                        <i data-lucide="sparkles" class="w-3 h-3 ml-1 text-sky-500"></i>

                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {activeTab === 'strategy' && (
                        <div class="space-y-8 animate-fadeIn">
                            {/* Vision statement card */}
                            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud">
                                <h3 class="text-xl font-bold text-sky-950 mb-3 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                    </svg>
                                    الرؤية الشخصية (Vision)
                                </h3>
                                <p class="text-sky-600 text-xs mb-3">صف ما تريد أن تكون عليه في مستقبلك الأقصى بكلمات ملهمة واضحة.</p>
                                <textarea 
                                    value={vision}
                                    onChange={(e) => setVision(e.target.value)}
                                    placeholder="اكتب رؤيتك الملهمة هنا..."
                                    class="w-full bg-sky-50/50 border border-sky-100 focus:border-sky-300 focus:ring-2 focus:ring-sky-200 rounded-2xl p-4 text-sky-950 text-sm font-medium focus:outline-none transition-all resize-none h-24"
                                />
                            </div>

                            {/* Values card */}
                            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud">
                                <h3 class="text-xl font-bold text-sky-950 mb-1 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.373-1.81.588-1.81h4.906a1 1 0 00.95-.69l1.519-4.674z" />
                                    </svg>
                                    القيم الأساسية المحركة (Core Values)

                                <p class="text-sky-600 text-xs mb-4">أضف القيم التي تحرك قراراتك وسلوكياتك اليومية (مثال: الشغف، الحرية المالية، النمو، العائلة).</p>
                                
                                <form onSubmit={handleAddValue} class="flex gap-2 mb-4">
                                    <input

                                        value={newValue}
                                        onChange={(e) => setNewValue(e.target.value)}
                                        placeholder="مثال: التميز المعرفي"
                                        class="flex-1 bg-sky-50/50 border border-sky-100 focus:border-sky-300 focus:ring-2 focus:ring-sky-200 rounded-xl px-4 py-2 text-sm text-sky-950 focus:outline-none"
                                    />
                                    <button 
                                        type="submit" 
                                        class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl text-xs font-bold transition-all shadow-md"

                                                {val}
                                                <button 
                                                    type="button" 
                                                    onClick={() => handleRemoveValue(idx)}

                                                    &times;
                                                </button>
                                            </span>
                                        ))
                                    )}

                            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud">
                                <h3 class="text-xl font-bold text-sky-950 mb-3 flex items-center gap-2">
                                    <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    المنظومة الاستراتيجية وبوصلة الأهداف
                                </h3>

                                <div class="space-y-6">

                                        <input 
                                            type="text" 
                                            value={strategicGoal}
                                            onChange={(e) => setStrategicGoal(e.target.value)}
                                            placeholder="ما هو الهدف الأهم الذي تسعى إليه جاهداً؟"
                                            class="w-full bg-sky-50/50 border border-sky-100 focus:border-sky-300 focus:ring-2 focus:ring-sky-200 rounded-2xl px-4 py-3.5 text-sky-950 text-sm font-semibold focus:outline-none transition-all"
                                        />
                                    </div>

                                    {/* Sub goals checklist */}
                                    <div class="pt-4 border-t border-sky-100">

                                                value={newSubGoal}

                                                type="submit" 
                                                class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl text-xs font-bold transition-all shadow-md"

                                                        <div class="flex items-center gap-3">

                                                                type="button" 
                                                                onClick={() => handleToggleSubGoal(sg.id)}

                                                                    sg.completed ? 'bg-sky-500 border-sky-500 text-white' : 'border-sky-300 hover:border-sky-400'

                                                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                                                    </svg>
                                                                )}
                                                            </button>
                                                            <span class="text-sm font-semibold">{sg.text}</span>
                                                        </div>

                                                        <button 
                                                            onClick={() => handleRemoveSubGoal(sg.id)}
                                                            class="text-sky-300 hover:text-red-500 transition-colors"
                                                            title="حذف الهدف"
                                                        >
                                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                                            </svg>
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Immediate manual save indicator */}
                            <div class="flex justify-end pt-4">
                                <button 
                                    onClick={triggerCloudSave}
                                    class="bg-sky-600 hover:bg-sky-700 text-white px-8 py-3.5 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center gap-2"
                                >
                                    حفظ وتثبيت على السحاب
                                </button>
                            </div>
                        </div>
                    )}

                    {}
                    {activeTab === 'tasks' && (
                        <div class="space-y-8 animate-fadeIn">
                            {/* Grid splitting daily urgent tasks and repetitive habits */}
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                
                                {/* Daily Focus Tasks */}
                                <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud">
                                    <div class="flex justify-between items-center mb-1">
                                        <h3 class="text-xl font-bold text-sky-950 flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full bg-sky-500"></span>
                                            المهام الاستراتيجية اليومية
                                        </h3>
                                        <span class="text-xs bg-sky-100 text-sky-800 px-2 py-1 rounded-md font-bold">
                                            {tasks.filter(t => t.category === 'daily' && t.completed).length} من {tasks.filter(t => t.category === 'daily').length}
                                        </span>
                                    </div>
                                    <p class="text-sky-600 text-xs mb-4">أهم أعمالك لهذا اليوم والتي تساهم في ريادة بوصلتك.</p>

                                    {/* Task quick adding form */}
                                    <form 
                                        onSubmit={(e) => {
                                            e.preventDefault();
                                            if (!newTaskText.trim()) return;
                                            const updated = [
                                                ...tasks,
                                                { id: Date.now(), text: newTaskText.trim(), completed: false, category: 'daily' }
                                            ];
                                            setTasks(updated);
                                            setNewTaskText('');
                                            saveToCloud({ ...getLatestState(), tasks: updated });
                                        }} 
                                        class="flex gap-2 mb-6"
                                    >
                                        <input 
                                            type="text" 
                                            value={newTaskCategory === 'daily' ? newTaskText : ''}
                                            onChange={(e) => {
                                                setNewTaskCategory('daily');
                                                setNewTaskText(e.target.value);
                                            }}
                                            placeholder="أضف مهمة استثنائية لليوم..."
                                            class="flex-1 bg-sky-50/50 border border-sky-100 focus:border-sky-300 focus:ring-2 focus:ring-sky-200 rounded-xl px-4 py-2 text-sm text-sky-950 focus:outline-none"
                                        />
                                        <button 
                                            type="submit" 
                                            class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-sm transition-all"
                                        >
                                            إضافة
                                        </button>
                                    </form>

                                    {/* List Daily Tasks */}
                                    <div class="space-y-2 max-h-[350px] overflow-y-auto pr-1 custom-scrollbar">
                                        {tasks.filter(t => t.category === 'daily').length === 0 ? (
                                            <p class="text-sky-400 text-xs italic py-8 text-center">لا توجد مهام يومية مسجلة.</p>
                                        ) : (
                                            tasks.filter(t => t.category === 'daily').map(task => (
                                                <div 
                                                    key={task.id}
                                                    class={`flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
                                                        task.completed 
                                                        ? 'bg-sky-50/50 border-sky-100 text-sky-400 line-through' 
                                                        : 'bg-white border-sky-100 text-sky-950'
                                                    }`}
                                                >
                                                    <div class="flex items-center gap-3">
                                                        <button 
                                                            onClick={() => handleToggleTask(task.id)}
                                                            class={`w-5 h-5 rounded-full border flex items-center justify-center transition-all ${
                                                                task.completed ? 'bg-sky-500 border-sky-500 text-white' : 'border-sky-300 hover:border-sky-400'
                                                            }`}
                                                        >
                                                            {task.completed && <span class="block w-1.5 h-1.5 bg-white rounded-full"></span>}
                                                        </button>
                                                        <span class="text-sm font-semibold">{task.text}</span>
                                                    </div>

                                                    <button 
                                                        onClick={() => handleRemoveTask(task.id)}
                                                        class="text-sky-300 hover:text-red-500"
                                                    >
                                                        &times;
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                {/* Recurring Routines / Habits */}
                                <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud">
                                    <div class="flex justify-between items-center mb-1">
                                        <h3 class="text-xl font-bold text-sky-950 flex items-center gap-2">
                                            <span class="w-3 h-3 rounded-full bg-sky-500"></span>
                                            الروتين والعادات المكررة
                                        </h3>
                                        <span class="text-xs bg-sky-100 text-sky-800 px-2 py-1 rounded-md font-bold">
                                            {tasks.filter(t => t.category === 'routine' && t.completed).length} من {tasks.filter(t => t.category === 'routine').length}
                                        </span>
                                    </div>
                                    <p class="text-sky-600 text-xs mb-4">الأنشطة الدورية التي تعيد تكوين خلايا انضباطك الذاتي.</p>

                                    {/* Routine quick adding form */}
                                    <form 
                                        onSubmit={(e) => {
                                            e.preventDefault();
                                            if (!newTaskText.trim()) return;
                                            const updated = [
                                                ...tasks,
                                                { id: Date.now(), text: newTaskText.trim(), completed: false, category: 'routine' }
                                            ];
                                            setTasks(updated);
                                            setNewTaskText('');
                                            saveToCloud({ ...getLatestState(), tasks: updated });
                                        }} 
                                        class="flex gap-2 mb-6"
                                    >
                                        <input 
                                            type="text" 
                                            value={newTaskCategory === 'routine' ? newTaskText : ''}
                                            onChange={(e) => {
                                                setNewTaskCategory('routine');
                                                setNewTaskText(e.target.value);
                                            }}
                                            placeholder="أضف عادة متكررة (مثال: شرب لتر ماء)..."
                                            class="flex-1 bg-sky-50/50 border border-sky-100 focus:border-sky-300 focus:ring-2 focus:ring-sky-200 rounded-xl px-4 py-2 text-sm text-sky-950 focus:outline-none"
                                        />
                                        <button 
                                            type="submit" 
                                            class="bg-sky-500 hover:bg-sky-600 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-sm transition-all"
                                        >
                                            إضافة
                                        </button>
                                    </form>

                                    {/* List Routine Tasks */}
                                    <div class="space-y-2 max-h-[350px] overflow-y-auto pr-1 custom-scrollbar">
                                        {tasks.filter(t => t.category === 'routine').length === 0 ? (
                                            <p class="text-sky-400 text-xs italic py-8 text-center">لا يوجد روتين دوري مضاف.</p>
                                        ) : (
                                            tasks.filter(t => t.category === 'routine').map(task => (
                                                <div 
                                                    key={task.id}
                                                    class={`flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
                                                        task.completed 
                                                        ? 'bg-sky-50/50 border-sky-100 text-sky-400 line-through' 
                                                        : 'bg-white border-sky-100 text-sky-950'
                                                    }`}
                                                >
                                                    <div class="flex items-center gap-3">
                                                        <button 
                                                            onClick={() => handleToggleTask(task.id)}
                                                            class={`w-5 h-5 rounded-md border flex items-center justify-center transition-all ${
                                                                task.completed ? 'bg-sky-500 border-sky-500 text-white' : 'border-sky-300 hover:border-sky-400'
                                                            }`}
                                                        >
                                                            {task.completed && (
                                                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                                                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                                                </svg>
                                                            )}
                                                        </button>
                                                        <span class="text-sm font-semibold">{task.text}</span>
                                                    </div>

                                                    <button 
                                                        onClick={() => handleRemoveTask(task.id)}
                                                        class="text-sky-300 hover:text-red-500"
                                                    >
                                                        &times;
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Clear option */}
                            {tasks.length > 0 && (
                                <div class="flex justify-start">
                                    <button 
                                        onClick={handleClearCompletedTasks}
                                        class="bg-red-50 text-red-600 hover:bg-red-100 px-5 py-2.5 rounded-2xl text-xs font-bold transition-all border border-red-100"
                                    >
                                        تصفية وتطهير المهام المكتملة
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {}
                    {activeTab === 'notes' && (
                        <div class="space-y-6 animate-fadeIn">
                            <div class="bg-white/80 backdrop-blur-md p-6 rounded-3xl border border-white/60 shadow-cloud flex flex-col h-[500px]">
                                <div class="flex justify-between items-center mb-4">
                                    <div>
                                        <h3 class="text-xl font-bold text-sky-950 flex items-center gap-2">
                                            <svg class="w-5 h-5 text-sky-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                                            </svg>
                                            مفكرة السحاب الحرة
                                        </h3>
                                        <p class="text-sky-600 text-xs">احفظ خواطرك، أفكارك الطارئة، وتأملاتك فور تبلورها في ذهنك.</p>
                                    </div>
                                    
                                    <button 
                                        onClick={() => {
                                            saveToCloud();
                                            showToast("تم الحفظ في السحابة بأمان.");
                                        }}
                                        class="text-xs bg-sky-100 hover:bg-sky-200 text-sky-800 px-4 py-2 rounded-xl font-bold transition-all"
                                    >
                                        حفظ فوري للمفكرة
                                    </button>
                                </div>

                                <textarea 
                                    value={noteText}
                                    onChange={(e) => {
                                        setNoteText(e.target.value);
                                        // Auto local saves are merged on sync actions
                                    }}
                                    placeholder="اكتب أفكارك القيادية وخلاصة كتبك وتأملاتك هنا بكل حرية ومرونة..."
                                    class="flex-1 w-full bg-sky-50/30 border border-sky-100/70 rounded-2xl p-5 text-sky-950 focus:outline-none focus:ring-2 focus:ring-sky-200 transition-all font-medium text-sm leading-relaxed resize-none custom-scrollbar"
                                />
                            </div>
                        </div>
                    )}

                    {/* Footer branding */}
                    <footer class="mt-16 text-center text-xs text-sky-500 space-y-2">
                        <p>© 2026 LeadMe. جميع الحقوق محفوظة لرواد السماء والقيادة الذاتية.</p>
                        <p class="text-sky-400">بنيت بشغف لتمكنك من قيادة غدك انطلاقاً من مبادئك اليوم.</p>
                    </footer>
                </div>
            );
        }

        // Render main React App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
